name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: gofmt -l . | tee /tmp/gofmt-out && test ! -s /tmp/gofmt-out
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go build -tags integration ./...
      - run: go test -race ./...
      # Integration tests (testDSN's TIDB_BINARY_MULTISTMT_TEST_DSN) need a
      # real TiDB and are intentionally not run here — manual/local-only,
      # same as tidb-multistmt's MULTISTMT_TEST_DSN-gated tests.

  fuzz:
    # The `test` job above already replays testdata/fuzz/*/* (the committed
    # seed/crasher corpus, including this package's one real find so far)
    # as ordinary deterministic test cases via plain `go test ./...` — Go
    # does that automatically, no -fuzz flag needed. This job instead runs
    # the actual fuzzing *engine* briefly on each target, to catch new bugs
    # before they're ever manually found — short per-target budgets so the
    # whole job stays fast enough for every push.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - FuzzReadPacket
          - FuzzDecodeColumnDef
          - FuzzDecodeBinaryRow
          - FuzzDrainExecuteResponse
          - FuzzReadOKorErr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test -run=^$ -fuzz=^${{ matrix.target }}$ -fuzztime=20s .
